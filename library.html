<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>JIMIN AUDIO ARCHIVE | 声音收藏馆</title>

    <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f5f3ef;
      color: #292929;
      font-family: -apple-system, BlinkMacSystemFont,
                   "Helvetica Neue", "PingFang SC",
                   "Microsoft YaHei", sans-serif;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
      padding: 30px 22px 60px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid #c9c5bf;
      padding-bottom: 18px;
      font-size: 10px;
      letter-spacing: 2px;
    }

    /* 顶部导航 */
    .site-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 20px 0;
      margin-bottom: 12px;
      border-bottom: 1px solid #ded9d1;
    }

    .site-brand {
      display: flex;
      flex-direction: column;
      gap: 4px;
      color: #302d2a;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2px;
      text-decoration: none;
      flex-shrink: 0;
    }

    .site-brand span {
      color: #89837b;
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 1px;
    }

    .site-nav {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      flex-wrap: wrap;
    }

    .site-nav a {
      display: inline-block;
      padding: 7px 13px;
      border: 1px solid #ded9d1;
      border-radius: 22px;
      background: #fffefa;
      color: #89837b;
      font-size: 11px;
      text-decoration: none;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .site-nav a:hover {
      border-color: #a58b73;
      background: #e8dfd3;
      color: #302d2a;
    }

    .hero {
      padding: 75px 0 55px;
    }

    .eyebrow {
      color: #888178;
      font-size: 11px;
      letter-spacing: 3px;
    }

    h1 {
      margin: 20px 0;
      font-family: Georgia, "Times New Roman", serif;
      font-weight: normal;
      font-size: clamp(42px, 11vw, 76px);
      line-height: 1.02;
      letter-spacing: -3px;
    }

    .intro {
      max-width: 400px;
      color: #77716a;
      font-size: 13px;
      line-height: 2;
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      border-bottom: 1px solid #c9c5bf;
      padding-bottom: 14px;
      margin-bottom: 5px;
    }

    .section-title h2 {
      margin: 0;
      font-size: 15px;
      font-weight: 500;
    }

    .section-title span {
      color: #928a80;
      font-size: 11px;
      letter-spacing: 1px;
      white-space: nowrap;
    }

    .audio-item {
      display: flex;
      align-items: flex-start;
      gap: 20px;
      padding: 25px 0;
      border-bottom: 1px solid #ddd8d0;
      text-decoration: none;
      color: inherit;
      transition: opacity 0.2s ease;
    }

    .item-number {
      min-width: 42px;
      padding-top: 4px;
      color: #928a80;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 18px;
    }

    .item-content {
      flex: 1;
      min-width: 0;
    }

    .item-title {
      font-size: 17px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .item-date {
      margin-top: 7px;
      color: #89837c;
      font-size: 11px;
      letter-spacing: 1px;
    }

    .arrow {
      color: #89837c;
      padding-top: 5px;
      font-size: 17px;
    }

    .audio-item:hover {
      opacity: 0.65;
    }

    .audio-item:active {
      opacity: 0.6;
    }

    .footer {
      margin-top: 65px;
      padding-top: 20px;
      border-top: 1px solid #c9c5bf;
      color: #999187;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 12px;
      line-height: 1.9;
    }

    @media (max-width: 480px) {
      .container {
        padding: 22px 18px 45px;
      }

      .site-header {
        align-items: flex-start;
        gap: 12px;
      }

      .site-brand {
        font-size: 11px;
        letter-spacing: 1.5px;
      }

      .site-nav {
        gap: 6px;
      }

      .site-nav a {
        padding: 6px 9px;
        font-size: 10px;
      }

      .audio-item {
        gap: 12px;
      }

      .item-number {
        min-width: 35px;
      }

      .item-title {
        font-size: 16px;
      }
    }

    @media (max-width: 360px) {
      .site-header {
        flex-direction: column;
      }

      .site-nav {
        justify-content: flex-start;
      }
    }
  </style>

</head>

<body>
  <main class="container">

    <div class="top">
  <span>JIMIN ARCHIVE</span>
  <span>EST. 2026</span>
</div>

<header class="site-header">
  <a class="site-brand" href=" ">
    JIMIN ARCHIVE
    <span>朴智旻个人收藏馆</span>
  </a >

  <nav class="site-nav">
    <a href="./index.html">主页</a >
    <a href="./videos.html">视频收藏馆</a >
  </nav>
</header>

<section>
  <div class="section-title">
    <h2>声音档案</h2>
    <span id="totalCount">03 RECORDS</span>
  </div>

  <div id="audioList"></div>
</section>

<footer class="footer">
  For the voice we want to remember.<br>
  JIMIN AUDIO ARCHIVE
</footer>

  </main>

    <script>
    const AUDIO_LIST = [
      {
        id: "001",
        title: "智旻自创rap",
        file: "jimin.mp3",
        date: "2013"
      },
      {
        id: "002",
        title: "智旻发来图书馆邀请",
        file: "audio002.mp3",
        date: "2013"
      },
      {
        id: "003",
        title: "excuse me",
        file: "audio003.mp3",
        date: "2014"
      }
    ];

    const list = document.getElementById("audioList");

    document.getElementById("totalCount").textContent =
      String(AUDIO_LIST.length).padStart(2, "0") + " RECORDS";

    AUDIO_LIST.forEach(function (audio) {
      const link = document.createElement("a");

      link.className = "audio-item";
      link.href = "./player.html?id=" +
        encodeURIComponent(audio.id) + "&refresh=1013";

      const number = document.createElement("div");
      number.className = "item-number";
      number.textContent = audio.id;

      const content = document.createElement("div");
      content.className = "item-content";

      const title = document.createElement("div");
      title.className = "item-title";
      title.textContent = audio.title;

      const date = document.createElement("div");
      date.className = "item-date";
      date.textContent = audio.date;

      content.appendChild(title);
      content.appendChild(date);

      const arrow = document.createElement("div");
      arrow.className = "arrow";
      arrow.textContent = "↗";

      link.appendChild(number);
      link.appendChild(content);
      link.appendChild(arrow);

      list.appendChild(link);
    });
  </script>

</body>
</html>
