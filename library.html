<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>JIMIN AUDIO ARCHIVE | 声音收藏馆</title>

    <style>
    :root {
      --bg: #F5F3EF;
      --white: #FFFEFA;
      --text: #302D2A;
      --muted: #89837B;
      --line: #DED9D1;
      --accent: #A58B73;
      --soft: #E8DFD3;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: #292929;
      font-family: -apple-system, BlinkMacSystemFont,
        "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
      padding: 0 22px 60px;
    }

    /* 导航栏：与视频收藏馆保持一致 */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 22px 0;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      color: var(--text);
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 2px;
      white-space: nowrap;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 14px;
    }

    nav a {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
      transition: color 0.2s ease;
    }

    nav a:hover {
      color: var(--accent);
    }

    /* 声音收藏馆原有列表样式 */
    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1px solid #c9c5bf;
      padding-bottom: 14px;
      margin-bottom: 5px;
    }

    .section-title h2 {
      margin: 0;
      font-size: 15px;
      font-weight: 500;
    }

    .section-title span {
      color: #928a80;
      font-size: 11px;
      letter-spacing: 1px;
    }

    .audio-item {
      display: flex;
      align-items: flex-start;
      gap: 20px;
      padding: 25px 0;
      border-bottom: 1px solid #ddd8d0;
      text-decoration: none;
      color: inherit;
    }

    .item-number {
      min-width: 42px;
      padding-top: 4px;
      color: #928a80;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 18px;
    }

    .item-content {
      flex: 1;
      min-width: 0;
    }

    .item-title {
      font-size: 17px;
      line-height: 1.6;
    }

    .item-date {
      margin-top: 7px;
      color: #89837c;
      font-size: 11px;
      letter-spacing: 1px;
    }

    .arrow {
      color: #89837c;
      padding-top: 5px;
      font-size: 17px;
    }

    .audio-item:active {
      opacity: 0.6;
    }

    .footer {
      margin-top: 65px;
      padding-top: 20px;
      border-top: 1px solid #c9c5bf;
      color: #999187;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 12px;
      line-height: 1.9;
    }

    .footer-note {
      font-family: -apple-system, BlinkMacSystemFont,
        "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 11px;
      line-height: 2;
    }

    @media (max-width: 520px) {
      .container {
        padding-right: 15px;
        padding-left: 15px;
      }

      header {
        align-items: flex-start;
      }

      nav {
        justify-content: flex-end;
        gap: 10px;
      }

      nav a {
        font-size: 10px;
      }

      .audio-item {
        gap: 12px;
      }

      .item-number {
        min-width: 35px;
      }

      .item-title {
        font-size: 16px;
      }
    }
  </style>

</head>

<body>
  <main class="container">

   <!-- 与视频收藏馆相同的导航栏 -->
<header>
  <a class="brand" href=" ">JIMIN ARCHIVE</a >

  <nav>
    <a href="./index.html">首页</a >
    <a href="./videos.html">视频收藏馆</a >
  </nav>
</header>

<!-- 声音档案列表 -->
<section>
  <div class="section-title">
    <h2>声音档案</h2>
    <span id="totalCount">03 RECORDS</span>
  </div>

  <div id="audioList"></div>
</section>

<!-- 原有版权说明 -->
<footer class="footer">
  JIMIN AUDIO ARCHIVE<br>
  <div class="footer-note">
    本页面音频版权归属官方，仅作为旻吧回忆录配套网页观赏使用<br>
    网页权限仅限购买者本人私人观看，严禁二次传播
  </div>
</footer>

  </main>

  <script>
    const AUDIO_LIST = [
      {
        id: "001",
        title: "智旻自创rap",
        file: "jimin.mp3",
        date: "2013"
      },
      {
        id: "002",
        title: "智旻发来图书馆邀请",
        file: "audio002.mp3", 
        date: "2013"
      },
      {
        id: "003",
        title: "excuse me",
        file: "audio003.mp3",
        date: "2014"
      }
    ];

    const list = document.getElementById("audioList");

    document.getElementById("totalCount").textContent =
      String(AUDIO_LIST.length).padStart(2, "0") + " RECORDS";

    AUDIO_LIST.forEach(function (audio) {
      const link = document.createElement("a");

      link.className = "audio-item";
      link.href = "./player.html?id=" + encodeURIComponent(audio.id) + "&refresh=1013";

      const number = document.createElement("div");
      number.className = "item-number";
      number.textContent = audio.id;

      const content = document.createElement("div");
      content.className = "item-content";

      const title = document.createElement("div");
      title.className = "item-title";
      title.textContent = audio.title;

      const date = document.createElement("div");
      date.className = "item-date";
      date.textContent = audio.date;

      content.appendChild(title);
      content.appendChild(date);

      const arrow = document.createElement("div");
      arrow.className = "arrow";
      arrow.textContent = "↗";

      link.appendChild(number);
      link.appendChild(content);
      link.appendChild(arrow);

      list.appendChild(link);
    });
  </script>
</body>
</html>
